version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - downloads:/downloads
    depends_on:
      - api
      - extractor

  api:
    build:
      context: ./api
    restart: unless-stopped
    ports:
      - "3005:3005"
    volumes:
      - api_data:/app/data
    environment:
      - SUPABASE_URL=https://pskbycyehmifqemjopyu.supabase.co
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBza2J5Y3llaG1pZnFlbWpvcHl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNDI5NDgsImV4cCI6MjEwMTgxODk0OH0.A2JCqutKlsnb2UBJKPj-o-Ll4Jaeo-7sL3LG3c0FjW0
    
  extractor:
    build:
      context: ./extractor
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - downloads:/app/downloads

volumes:
  caddy_data:
  caddy_config:
  downloads:
  api_data:
