version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - downloads:/downloads
    depends_on:
      - api
      - extractor

  api:
    build:
      context: ./api
    restart: unless-stopped
    ports:
      - "3005:3005"
    volumes:
      - api_data:/app/data
      - downloads:/downloads
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - EXTRACTOR_ADMIN_TOKEN=${EXTRACTOR_ADMIN_TOKEN}
      - DOWNLOADS_DIR=/downloads
      - EXTRACTOR_BASE=http://extractor:8000

  extractor:
    build:
      context: ./extractor
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - downloads:/app/downloads
    environment:
      - ADMIN_TOKEN=${EXTRACTOR_ADMIN_TOKEN}

volumes:
  caddy_data:
  caddy_config:
  downloads:
  api_data:
